name: l2-admin

services:
  admin:
    image: l2-admin:dev
    build:
      context: ./web
      secrets: [npm_token]
    ports: ['127.0.0.1:3002:3002']
    environment:
      NUXT_PUBLIC_ADMIN_API_BASE: ${NUXT_PUBLIC_ADMIN_API_BASE:-http://localhost:5201}

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
