name: l2-admin

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-l2web};Username=${POSTGRES_USER:-l2web};Password=${POSTGRES_PASSWORD:-l2web_dev}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-l2web}
      POSTGRES_USER: ${POSTGRES_USER:-l2web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-l2web_dev}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  admin-api:
    image: ${L2_ADMIN_API_IMAGE:-l2-admin-api:dev}
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT: server/L2.Admin.Api/L2.Admin.Api.csproj
    command: ['L2.Admin.Api.dll']
    environment:
      <<: *dotnet-environment
      Admin__AllowContainerAccess: 'true'
    ports: ['127.0.0.1:5201:8080']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  admin:
    image: ${L2_ADMIN_IMAGE:-l2-admin:dev}
    build:
      context: ./web
      secrets: [npm_token]
    ports: ['127.0.0.1:3002:3002']
    environment:
      NUXT_PUBLIC_ADMIN_API_BASE: ${NUXT_PUBLIC_ADMIN_API_BASE:-http://localhost:5201}
    depends_on:
      admin-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
