services:
  admin:
    build: .
    ports:
      - '3002:3002'
    environment:
      NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:?Set NODE_AUTH_TOKEN to a GitHub Packages token}
      NUXT_PUBLIC_ADMIN_API_BASE: ${NUXT_PUBLIC_ADMIN_API_BASE:-http://localhost:5201}
      L2_PUBLIC_ASSETS_DIR: /workspace/assets
    volumes:
      - .:/workspace
      - admin-node-modules:/workspace/node_modules
      - ./assets:/workspace/assets:ro
    command: sh -c 'npm ci && npm run dev'

volumes:
  admin-node-modules:
