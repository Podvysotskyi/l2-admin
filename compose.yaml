name: l2-admin

services:
  admin-api:
    image: ${L2_ADMIN_API_IMAGE:-l2-admin-api:dev}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep --quiet "^HTTP/1.1 200" <&3'
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  admin:
    image: ${L2_ADMIN_IMAGE:-l2-admin:dev}
    build:
      context: ./web
      target: development
      args:
        APP_ENV: development
    environment:
      NODE_ENV: development
    init: true
    ports:
      - '127.0.0.1:${ADMIN_WEB_PORT:-3002}:3002'
    depends_on:
      admin-api:
        condition: service_healthy
    restart: unless-stopped
